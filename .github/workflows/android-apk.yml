name: Build Android APK

# This machine has no Android SDK/Gradle/JDK, so the debug APK is built here instead — a runner
# GitHub already provisions with all three. Direct-install distribution (no Play Store), matching
# the crew rollout plan: download this workflow's "insulator-inspector-debug-apk" artifact from a
# finished run and sideload it (Settings > allow install from this source, then open the .apk).
#
# This is a debug build (self-signed with Android's default debug key) — fine for installing
# directly on crew phones, but if this ever needs to go through the Play Store instead, it needs a
# proper release signing key first.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @capacitor/cli 8 hard-requires Node >=22 ("cap sync" refuses to run below it)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the web app for the native shell
        run: npm run build:capacitor

      - name: Sync into the Android project
        id: sync
        continue-on-error: true
        run: npx cap sync android 2>&1 | tee ../sync.log

      - name: Build debug APK
        id: gradle
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../gradle.log

      # Uploaded even on failure. Both the job-logs API and artifact downloads require an
      # authenticated request even on a public repo (GitHub tightened this) — kept anyway since a
      # human with repo access can still open this run's page and download it from there.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            sync.log
            gradle.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: steps.gradle.outcome == 'success'
        with:
          name: insulator-inspector-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Fail the job if a build step failed
        if: steps.sync.outcome != 'success' || steps.gradle.outcome != 'success'
        run: exit 1
